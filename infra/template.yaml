AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Demand Intelligence Agent backend infrastructure

Globals:
  Function:
    Runtime: python3.12
    Timeout: 30
    MemorySize: 512
    Architectures:
      - x86_64

Resources:
  AnalysisTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
        - AttributeName: gsi1pk
          AttributeType: S
        - AttributeName: gsi1sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: gsi1pk
              KeyType: HASH
            - AttributeName: gsi1sk
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  AnalysisBucket:
    Type: AWS::S3::Bucket

  CognitoUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: demand-intelligence-agent-users
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
  CognitoUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref CognitoUserPool
      ClientName: demand-intelligence-agent-web
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
  CognitoCustomerGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: CUSTOMER
      UserPoolId: !Ref CognitoUserPool
      Precedence: 20
  CognitoEmployeeGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: EMPLOYEE
      UserPoolId: !Ref CognitoUserPool
      Precedence: 10

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend
      Handler: app.main.lambda_handler
      Environment:
        Variables:
          APP_TABLE_NAME: !Ref AnalysisTable
          APP_BUCKET_NAME: !Ref AnalysisBucket
          BEDROCK_MODEL_ID: openai.gpt-oss-20b
          COGNITO_USER_POOL_ID: !Ref CognitoUserPool
          COGNITO_APP_CLIENT_ID: !Ref CognitoUserPoolClient
          BEDROCK_MANTLE_ENDPOINT: https://bedrock-mantle.us-east-2.api.aws/v1
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref AnalysisTable
        - S3CrudPolicy:
            BucketName: !Ref AnalysisBucket
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
                - bedrock:InvokeModelWithResponseStream
                - bedrock:Converse
                - bedrock-mantle:CreateInference
              Resource: '*'
      Events:
        Api:
          Type: Api
          Properties:
            Path: /{proxy+}
            Method: any
        RefreshSchedule:
          Type: Schedule
          Properties:
            Schedule: rate(1 day)
            Input: '{"source":"aws.events"}'

Outputs:
  ApiUrl:
    Value: !Sub 'https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod'
  CognitoUserPoolId:
    Value: !Ref CognitoUserPool
  CognitoAppClientId:
    Value: !Ref CognitoUserPoolClient
